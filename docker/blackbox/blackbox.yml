# Black-box мониторинг: смотрим на сервис снаружи, как пользователь, ничего
# не зная о его внутренностях. Экспортеры (white-box) говорят «воркеры заняты,
# БД отвечает», а проба отвечает на главный вопрос — «сайт работает или нет».
# Одна только white-box картина может быть зелёной, когда пользователи видят 502.
#
# Модуль — это «как проверять». Что проверять (URL) задаётся в prometheus.yml:
# Prometheus передаёт target параметром ?target=..., и одна проба = один скрейп.
modules:
  # Health-эндпоинт приложения. Одного кода 200 мало: health.php честно отдаёт 503,
  # если БД недоступна, но 200 может прийти и от заглушки/кэша/чужого сервера.
  # Поэтому дополнительно проверяем тело — это и есть «контракт» health-check'а
  http_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      # Имена в docker-сети резолвятся в IPv4; без этого blackbox сначала пробует IPv6
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"ok"'

  # Просто «отвечает 2xx». Для /nginx-health: nginx отдаёт его сам, не трогая
  # php-fpm, — так можно отличить «упал nginx» от «упал php/БД за ним»
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
