; Подключается только из compose.monitoring.yaml — базовое окружение работает без него.
; auto_prepend_file выполняет инструментацию перед каждым PHP-скриптом: метрики
; собираются для всех эндпоинтов разом, без правки кода каждого из них
auto_prepend_file = /var/www/html/instrumentation/prepend.php

; Под метрики хватает и дефолтных 32M; указываем явно, чтобы было видно, где крутить,
; если рядов станет много (переполнение APCu = потерянные метрики, см. apcu_sma_info())
apc.shm_size = 32M
