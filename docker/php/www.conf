; Пул воркеров php-fpm. Файл целиком заменяет дефолтный www.conf образа —
; поэтому здесь прописаны все обязательные директивы, а не только кастомные
[www]

; От чьего имени работают воркеры (см. UID/GID в Dockerfile)
user = www-data
group = www-data

; TCP-порт вместо unix-сокета — так nginx из соседнего контейнера достучится по имени сервиса
listen = 9000

; Динамический пул с небольшими лимитами — этого достаточно для дев-окружения
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Служебный эндпоинт для healthcheck: cgi-fcgi запрашивает /ping и ждёт ответ "pong"
ping.path = /ping

; Страница статуса пула: сколько воркеров заняты/свободны, длина очереди (listen queue)
; и сколько раз упёрлись в pm.max_children. Её по FastCGI напрямую читает
; php-fpm_exporter. Через nginx наружу она не видна: в nginx на php-fpm уходят
; только *.php, а /status попадёт в try_files → index.php
pm.status_path = /status

; По умолчанию php-fpm вырезает переменные окружения перед запуском воркеров —
; clear_env = no сохраняет DB_HOST и другие переменные из compose.yaml доступными в getenv()
clear_env = no
