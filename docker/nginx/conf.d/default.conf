server {
    listen 80;
    server_name _;

    # Наружу торчит только public/ — исходники src/, composer.json и vendor/ недоступны
    root /var/www/html/public;
    index index.php;

    # Согласовано с upload_max_filesize/post_max_size в php.ini
    client_max_body_size 20m;

    # Адрес php-fpm берём из переменной, а не пишем в fastcgi_pass напрямую. С константой
    # nginx резолвит имя `php` один раз при старте и навсегда запоминает IP. Если контейнер
    # php пересоздать (например, `make mon-up` включает в нём метрики), он получит новый IP,
    # а nginx продолжит стучаться в старый — 502, хотя оба контейнера «healthy».
    # С переменной nginx спрашивает встроенный DNS Docker (127.0.0.11) во время работы
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Health-эндпоинт для healthcheck контейнера: просто 200, без записи в access_log
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Метрики приложения наружу не отдаём: Prometheus забирает их через внутренний
    # :8081 (status.conf). Точное совпадение (=) проверяется раньше regex-локации .php,
    # поэтому запрос сюда не дойдёт до php-fpm. 404, а не 403, — не подсказываем,
    # что за этим адресом что-то есть
    location = /metrics.php {
        return 404;
    }

    location / {
        # Если файл/директория не найдены — отдаём на откуп index.php
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        # Не передавать в php-fpm несуществующие скрипты (защита от подстановки PATH_INFO)
        try_files $uri =404;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.п.), если они вдруг окажутся в public/
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
