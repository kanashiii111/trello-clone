# Формат access log в JSON — для сбора логов в Graylog (compose.logging.yaml).
# Здесь только объявление формата (log_format допустим лишь на уровне http, поэтому
# отдельный файл в conf.d, а «00-» — чтобы он подключился раньше server'ов).
# Какой формат реально пишется, решает snippets/access_log.conf: в базовом окружении —
# привычный текстовый main, под логированием файл подменяется на JSON-вариант.
#
# Зачем JSON: текстовую строку лога Graylog увидит одним полем message, и искать
# «все 5xx медленнее секунды» пришлось бы регулярками. Из JSON каждое поле становится
# отдельным полем сообщения: status:500 AND request_time:>1.
# escape=json — nginx сам экранирует кавычки и спецсимволы в значениях
# (иначе User-Agent с кавычкой сломал бы JSON).
log_format json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        # uri — путь без query string: параметры могут содержать персональные
        # данные и токены, а в логах они живут дольше, чем кажется
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        # Полное время запроса глазами nginx (секунды, с миллисекундами)
        '"request_time":$request_time,'
        # Сколько ответа ждали от php-fpm. Разница с request_time — время на стороне
        # nginx/сети; пусто, если запрос не ходил в upstream (статика, /nginx-health)
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
    '}';
