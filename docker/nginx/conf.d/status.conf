# Внутренний служебный server для мониторинга. Порт 8081 не публикуется на хост
# (в compose.yaml наружу проброшен только :80), поэтому сюда можно попасть только
# из docker-сети — оттуда ходят экспортеры и Prometheus. Служебные страницы не должны
# торчать наружу: по ним видно внутреннее устройство сервиса и его нагрузку.
# Отдельный порт надёжнее, чем allow/deny по IP на :80: на Docker Desktop запросы
# с хоста приходят в контейнер с IP шлюза docker-сети и выглядят как «внутренние».
server {
    listen 8081;
    server_name _;

    # Prometheus опрашивает эти страницы каждые 15 секунд — в access_log это только шум
    access_log off;

    # Адрес php-fpm через resolver и переменную — почему так, см. default.conf
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;

    # Базовые счётчики nginx (активные соединения, принятые/обработанные, запросы).
    # Их читает nginx-prometheus-exporter и переводит в формат Prometheus
    location = /stub_status {
        stub_status;
    }

    # Метрики приложения (app/public/metrics.php) — тот же php-fpm, что и у
    # основного server, но доступ только отсюда. Наружу (:80) этот путь закрыт
    location = /metrics.php {
        root /var/www/html/public;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        return 404;
    }
}
