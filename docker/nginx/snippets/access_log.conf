# Формат access log для основного server (подключается из default.conf).
# В базовом окружении — стандартный текстовый формат образа nginx (main).
# compose.logging.yaml монтирует поверх этого файла docker/nginx/logging/access_log.conf
# с JSON-форматом: так конфиг nginx не дублируется, а меняется одна строка
access_log /var/log/nginx/access.log main;
