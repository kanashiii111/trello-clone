# Prometheus сам ходит за метриками (pull-модель): раз в scrape_interval делает
# HTTP GET /metrics на каждый target. Если target не ответил — метрика up{...} = 0,
# и это уже сигнал сам по себе: «мы не знаем, что с сервисом» ≠ «с сервисом всё хорошо».
global:
  # 15 секунд — компромисс для дев-окружения: графики достаточно подробные,
  # а данных за 7 дней немного. В проде часто ставят 30s–1m
  scrape_interval: 15s
  # Как часто вычислять правила алертов (появятся на этапе 5)
  evaluation_interval: 15s

scrape_configs:
  # Prometheus тоже сервис, и его тоже надо мониторить: сколько серий, сколько
  # занимает TSDB, не падают ли скрейпы
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # nginx сам не умеет отдавать метрики в формате Prometheus — экспортер читает
  # stub_status (внутренний :8081, см. docker/nginx/conf.d/status.conf) и переводит
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Пул php-fpm: занятые/свободные воркеры, очередь, упирание в max_children
  - job_name: php-fpm
    static_configs:
      - targets: ["php-fpm-exporter:9253"]

  # PostgreSQL: коннекты, транзакции, размер БД, pg_stat_statements.
  # Важно: если упадёт сама БД, up{job="postgres"} останется 1 (экспортер-то жив),
  # а pg_up станет 0 — алерт PostgresDown будет смотреть именно на pg_up
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Метрики самого приложения (white-box): RED по маршрутам и бизнес-метрика.
  # Ходим через внутренний server nginx :8081 — снаружи /metrics.php закрыт
  - job_name: app
    metrics_path: /metrics.php
    static_configs:
      - targets: ["nginx:8081"]

  # Сам blackbox-exporter — чтобы заметить, если сломались не пробы, а он сам
  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Black-box пробы. Prometheus ходит не на nginx, а на blackbox-exporter:
  # GET /probe?module=...&target=<url>, и тот уже делает реальный запрос.
  # relabel_configs ниже — стандартный приём для этого: адрес из targets
  # превращается в параметр target, в метку instance (чтобы на графиках был URL,
  # а не адрес экспортера), а сам скрейп уходит на blackbox-exporter.
  # Результат — метрика probe_success (1/0) плюс время, код ответа и т.п.
  # Ходим на http://nginx/ изнутри docker-сети — тот же путь, что у запроса
  # пользователя, кроме проброса порта на хост
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_health]
    static_configs:
      - targets: ["http://nginx/health.php"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-nginx
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/nginx-health"]
    # YAML-якорь: те же правила, что выше, без копипасты
    relabel_configs: *blackbox_relabel

  # cAdvisor необязателен (compose profile «cadvisor»). Поэтому не static_configs,
  # а DNS-обнаружение: если контейнер не запущен, имя не резолвится, target'ов
  # просто нет — и не висит вечный «DOWN», который зря поднимал бы TargetDown.
  # Цена — ошибка резолва в логах Prometheus раз в refresh_interval
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["cadvisor"]
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      # Вместо IP контейнера (меняется при пересоздании) — стабильное имя
      - target_label: instance
        replacement: cadvisor
