# Минимальный рабочий конфиг для учебного окружения.
# Файл подключается целиком через `command: postgres -c config_file=...`,
# поэтому всё, что не указано здесь, берётся из встроенных умолчаний PostgreSQL.

# Слушаем все интерфейсы контейнера — по умолчанию только localhost,
# и тогда ни nginx/php, ни клиент с хоста не смогут подключиться
listen_addresses = '*'
port = 5432

# Логируем запросы длительностью от 500 мс — простой способ ловить медленные места
log_min_duration_statement = 500
log_destination = 'stderr'
# Префикс строки лога: время, pid и application_name (%a). PHP кладёт в application_name
# request_id от nginx (см. app/src/Database.php), поэтому в строке slow-log видно,
# какой HTTP-запрос его породил. Остальное — как по умолчанию в PostgreSQL
log_line_prefix = '%m [%p] app=%a '

# pg_stat_statements копит статистику по каждому типу запроса: сколько раз выполнялся,
# суммарное/среднее время, сколько строк вернул. Это первое, куда смотрят при вопросе
# «что тормозит в БД». Модуль должен быть загружен при старте сервера — поэтому
# shared_preload_libraries, и поэтому после правки нужен рестарт, а не reload.
# Сам extension (представление pg_stat_statements) создаётся отдельно — см. initdb/02-monitoring.sh
shared_preload_libraries = 'pg_stat_statements'

# Разумные значения по умолчанию для маленького дев-окружения
max_connections = 100
shared_buffers = 128MB
